<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar(null, null)}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-auth p-4">
                <h1 class="h4 text-center fw-bold mb-1">Iniciar sesión</h1>
                <p class="text-muted text-center small mb-4">Mesa de Atención a Fallas de Redes</p>

                <div th:if="${mensajeError}" class="alert alert-danger py-2 small" th:text="${mensajeError}"></div>
                <div th:if="${mensajeInfo}" class="alert alert-info py-2 small" th:text="${mensajeInfo}"></div>
                <div th:if="${mensajeExito}" class="alert alert-success py-2 small" th:text="${mensajeExito}"></div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="username" name="username"
                               placeholder="" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="" required>
                    </div>
                    <button type="submit" class="btn btn-primario w-100 fw-semibold">Entrar</button>
                </form>

                <hr class="my-4">

                <div class="d-grid gap-2">
                    <a th:href="@{/registro/cliente}" class="btn btn-outline-primary btn-sm">
                        Crear cuenta como Cliente
                    </a>
                    <a th:href="@{/registro/admin}" class="btn btn-outline-secondary btn-sm">
                        Registrarse como Administrador
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
