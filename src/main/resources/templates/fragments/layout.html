<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' | Mesa de Ayuda Redes FES Aragón'">Sistema de Tickets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<nav th:fragment="navbar(nombreUsuario, rolUsuario)" class="navbar navbar-expand-lg navbar-dark navbar-fesa shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">
            Soporte de Redes · FES Aragón
        </a>
        <div class="d-flex align-items-center gap-3" th:if="${nombreUsuario != null}">
            <span class="text-white-50 small">
                <strong class="text-white" th:text="${nombreUsuario}">Usuario</strong>
                <span class="badge bg-light text-dark ms-1" th:text="${rolUsuario}">ROL</span>
            </span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="py-3 mt-auto text-center text-muted">
    <div class="container">
        Sistema de Tickets de Atención a Fallas de Redes · Ingeniería en Computación (FES Aragón)
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>
