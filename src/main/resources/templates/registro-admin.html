<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registro de Administrador')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar(null, null)}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card card-auth p-4">
                <h1 class="h4 text-center fw-bold mb-1">Registro de Administrador</h1>
                <p class="text-muted text-center small mb-4">Requiere un número de empleado autorizado de un solo uso</p>

                <div th:if="${mensajeError}" class="alert alert-danger py-2 small" th:text="${mensajeError}"></div>

                <form th:action="@{/registro/admin}" th:object="${usuario}" method="post">
                    <input type="hidden" th:field="*{rol}">
                    <input type="hidden" th:field="*{guid}">

                    <div class="mb-3">
                        <label class="form-label">Número de empleado</label>
                        <input type="text" class="form-control" th:field="*{numeroEmpleado}"
                               placeholder="9 dígitos" inputmode="numeric" maxlength="9" pattern="\d{9}" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('numeroEmpleado')}" th:errors="*{numeroEmpleado}"></div>
                        <div class="form-text">Cada clave autorizada solo puede utilizarse una vez.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nombre completo</label>
                        <input type="text" class="form-control" th:field="*{nombre}" placeholder="" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" th:field="*{email}" placeholder="" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Teléfono <span class="text-muted small">(opcional)</span></label>
                        <input type="text" class="form-control" th:field="*{telefono}" placeholder="">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control" th:field="*{password}" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}" placeholder="minimo 6 caracteres"></div>
                    </div>

                    <button type="submit" class="btn btn-primario w-100 fw-semibold">Registrarme como Administrador</button>
                </form>

                <div class="text-center mt-3">
                    <a th:href="@{/login}" class="small text-decoration-none">Volver a iniciar sesión</a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
